name: tests

# All three platforms gate. macOS arm64 is where every reported number was measured, but
# Windows and Linux ship prebuilt apps, so a test failure on either is a real failure.
#
# They were advisory, on the reasoning that an unsupported target should not mark the
# repository broken. What that actually bought was a red Windows job nobody looked at for
# weeks: 34 errors and one failure, every one of them the same UnicodeDecodeError from
# reading a UTF-8 file with cp1252, while the run reported success. The same root cause
# silently corrupts the "Centroid X µm" header on any file handed between platforms.
#
# "Advisory" is only honest when someone reads the advice. fail-fast stays off so one
# platform's failure still lets the others finish: the point is three verdicts, not a stop
# at the first.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS arm64
          - os: ubuntu-latest
            name: Linux x86_64
          - os: windows-latest
            name: Windows x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pinned dependencies
        # Versions are pinned deliberately (see requirements.txt): numpy/scipy/opencv drift
        # can move percentiles and Otsu output, which can flip a significance verdict.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install the Windows GUI backend
        # Not in requirements.txt because it is Windows-only, but without it
        # test_windows_gui_backend.py skips — and that test covers the one failure that has
        # actually reached a user: a downloaded bundle whose .NET assembly Windows blocks.
        if: runner.os == 'Windows'
        run: pip install pythonnet

      - name: Show environment
        run: |
          python -VV
          python -c "import platform; print('machine:', platform.machine())"
          python -c "import torch; print('torch', torch.__version__)"
          python -c "import cv2, numpy, scipy, shapely, SimpleITK; print('imaging stack OK')"

      - name: Resolve bundled model and app directories
        # Catches platform-specific path bugs directly: the model must be found from a clean
        # checkout, and the config/output directories must resolve to something sane on this
        # OS rather than a hardcoded POSIX path.
        run: |
          python -c "from oasis.common.paths import default_model_dir, user_config_dir, default_output_dir; print('model :', default_model_dir()); print('config:', user_config_dir()); print('output:', default_output_dir())"

      - name: Run test suite
        # Dataset-backed tests skip with a message naming the dataset; datasets are never
        # committed, so CI exercises the dataset-free tests.
        run: python -m pytest -v

      - name: Model fidelity against the vendored InstanSeg reference
        # The strongest check available without external data: the vendored model must still
        # reproduce its own published reference output exactly. Needs no reference image, so
        # it runs identically on every platform.
        run: python validation/validate_native_segmenter.py --image no-such-file --geojson no-such-file
