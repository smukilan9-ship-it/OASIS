name: win-probe

# TEMPORARY. Reproduces the Windows startup failure reported against v0.1.3 and checks the
# repair, without waiting for a full PyInstaller build. Delete once the fix has shipped and
# tests.yml carries tests/test_windows_gui_backend.py.

on: workflow_dispatch

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest numpy pythonnet

      - name: What this runner has
        shell: pwsh
        run: |
          python -c "import pythonnet, os; print('pythonnet at', os.path.dirname(pythonnet.__file__))"
          $r = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full' -ErrorAction SilentlyContinue
          "'.NET Framework 4 release: $($r.Release)  version: $($r.Version)'"
          "volume filesystem: $((Get-Volume -DriveLetter C).FileSystemType)"

      - name: Reproduce, then repair
        run: python -m pytest tests/test_windows_gui_backend.py -v -rs
