name: release

# Builds the desktop bundle on each platform and attaches it to a GitHub Release.
#
# PyInstaller cannot cross-compile: every OS/architecture must be built on its own runner.
# That is the whole reason this matrix exists.
#
# Intel macOS is absent on purpose — PyTorch publishes no macOS x86_64 wheel, so there is
# no segmenter and therefore nothing to build. See the platform table in README.md.
#
# Each job also publishes a SHA-256 for its asset. That is not decoration: a QuPath
# extension that downloads and executes one of these bundles has to be able to verify what
# it fetched (see issue #8).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # so the build can be exercised without cutting a release

permissions:
  contents: write         # required to create/modify releases

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # All three are supported deliverables, so all three gate the release. They were
    # advisory while Windows and Linux were being brought up; each has since built and
    # passed the frozen smoke test on its own runner, and leaving them advisory now would
    # mean publishing a release whose Windows asset is missing or broken without anything
    # going red. fail-fast stays off so one platform's failure still lets the others finish
    # and report — the point is to see all three verdicts, not to stop at the first.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS arm64
            asset: OASIS-macos-arm64.zip
          - os: windows-latest
            name: Windows x64
            asset: OASIS-windows-x64.zip
          - os: ubuntu-latest
            name: Linux x86_64
            asset: OASIS-linux-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Linux GUI backend dependencies
        # pywebview has no bundled backend on Linux; it binds to the system GTK/WebKit2
        # stack, which must be present for PyInstaller to analyse the import.
        #
        # THE APT PACKAGES ARE NOT ENOUGH. `python3-gi` installs the `gi` module into the
        # SYSTEM python, and this job builds with the setup-python interpreter, which cannot
        # see it. PyInstaller therefore analysed a `gi` that was not importable and froze a
        # bundle with no GUI backend at all: the Linux download of v0.1.0 could not open a
        # window, and nothing noticed, because the only frozen check ran the analysis path.
        # PyGObject from pip builds against libgirepository1.0-dev, which is installed here,
        # and lands in the interpreter that actually does the freezing.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1
          # Pinned below 3.52: that release moved to girepository-2.0, which Ubuntu does not
          # ship a -dev package for here, so the build fails at
          # "Dependency 'girepository-2.0' is required but not found". 3.50.x builds against
          # libgirepository1.0-dev, installed above.
          pip install pycairo "PyGObject<3.52"
          python -c "import gi; gi.require_version('Gtk', '3.0'); print('gi OK', gi.__file__)"

      - name: Install CPU-only torch (Linux)
        # On Linux, pip's default torch wheel is the CUDA build (2.13.0+cu130). It drags in
        # ~2.4 GB of NVIDIA runtime — cuBLAS, cuDNN, cuFFT, cuRAND — and produced a 2,685 MB
        # bundle against 268 MB on macOS. OASIS segments on CPU here (MPS is Apple-only), so
        # every byte of that is dead weight for the overwhelming majority of users.
        #
        # Installed BEFORE requirements.txt so pip sees torch==2.13.0 already satisfied and
        # does not fetch the CUDA wheel first. Linux users who do want CUDA should install
        # from source, where pip gives them the CUDA build by default.
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Windows GUI backend
        # pywebview drives the WebView2 runtime through pythonnet on Windows.
        if: runner.os == 'Windows'
        run: pip install pythonnet

      - name: Verify the vendored model is present
        # Building without it yields an app that starts and then fails on the first image.
        run: python -c "from oasis.common.paths import bundled_model_dir; p = bundled_model_dir(); assert p, 'vendored InstanSeg model missing'; print('model:', p)"

      - name: Build
        run: python -m PyInstaller --noconfirm --clean packaging/OASIS.spec

      - name: Smoke-test the frozen bundle
        # Bounded so a hanging bundle fails in minutes with usable logs, instead of sitting
        # at the 90-minute job limit and publishing nothing. A frozen app that hangs is a
        # real failure mode, not a slow one — see the freeze_support() note in app.py.
        timeout-minutes: 12
        # "It built" and "it works" are different claims. Every bundle-only failure so far
        # (cv2 refusing to import inside a .app, torch absent from a build that completed
        # happily, index.html resolved against a path that stops existing once frozen)
        # produced a green build and a broken app. This drives the real frozen entry point
        # on the model's own reference image, so a broken bundle cannot reach a release.
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   BIN="dist/OASIS.app/Contents/MacOS/OASIS" ;;
            Windows) BIN="dist/OASIS/OASIS.exe" ;;
            *)       BIN="dist/OASIS/OASIS" ;;
          esac
          test -x "$BIN" || { echo "no executable at $BIN"; ls -R dist | head -40; exit 1; }
          python packaging/smoke_test.py prepare --dir smoke
          "$BIN" --oasis-worker run_pipeline --config smoke/config.yaml
          python packaging/smoke_test.py check --dir smoke
          # AND THE UI, which the line above does not touch. The worker path segments an
          # image headlessly and shares almost no code with startup, so v0.1.0 shipped a
          # Windows bundle whose window could never open — `file://` + a "C:\..." path is
          # a URL whose host is the path — and every job here went green. This resolves the
          # UI file, builds the URL the window is given, and imports the platform's GUI
          # backend. No window is opened, so it runs on a headless runner.
          "$BIN" --oasis-check-ui

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          test -d dist/OASIS.app || { echo "dist/OASIS.app was not produced"; exit 1; }
          ditto -c -k --keepParent dist/OASIS.app "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" | tee "${{ matrix.asset }}.sha256"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          test -d dist/OASIS || { echo "dist/OASIS was not produced"; exit 1; }
          tar -czf "${{ matrix.asset }}" -C dist OASIS
          sha256sum "${{ matrix.asset }}" | tee "${{ matrix.asset }}.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path dist/OASIS)) { throw "dist/OASIS was not produced" }
          Compress-Archive -Path dist/OASIS -DestinationPath "${{ matrix.asset }}"
          $h = (Get-FileHash "${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLower()
          "$h  ${{ matrix.asset }}" | Tee-Object -FilePath "${{ matrix.asset }}.sha256"

      - name: Report size and guard against bloat
        # A 2.7 GB Linux bundle shipped once because pip silently chose the CUDA torch
        # wheel. Nothing failed — it just built something nobody should download. This
        # turns that class of regression into a build failure instead of a surprise for
        # whoever clicks the release link.
        shell: bash
        run: |
          ls -lh "${{ matrix.asset }}"
          bytes=$(python -c "import os,sys; print(os.path.getsize(sys.argv[1]))" "${{ matrix.asset }}")
          mb=$(( bytes / 1048576 ))
          echo "asset size: ${mb} MB"
          # Reference points: QuPath's own installers are 229-271 MB, and OASIS should sit
          # in the same range. 600 MB is loose enough to absorb normal dependency growth
          # and tight enough to catch an accidental GPU/toolkit stack.
          if [ "$mb" -gt 600 ]; then
            echo "::error::Bundle is ${mb} MB, over the 600 MB limit. Something large was"
            echo "::error::pulled in unintentionally — check for CUDA/GPU wheels or a"
            echo "::error::forgotten exclude before releasing this."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
